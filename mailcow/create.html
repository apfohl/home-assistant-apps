<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailcow — Create Alias</title>
    <style>
        :root {
            --bg:      #1a1a1a;
            --surface: #242424;
            --surface2:#2e2e2e;
            --border:  #383838;
            --accent:  #f5c518;
            --text:    #e8e8e8;
            --muted:   #888888;
            --ok:      #4caf82;
            --error:   #e04c4c;
            --radius:  8px;
            --font:    'Segoe UI', system-ui, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.6;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: #2a2200;
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.04em;
        }

        h1 span {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.02em;
            margin-top: 2px;
        }

        .nav {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
            position: relative;
        }

        .nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1;
            padding: 4px 9px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        .nav-toggle:hover,
        .nav.open .nav-toggle {
            color: var(--text);
            border-color: var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 0.4rem;
        }

        .nav-link {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 5px;
            border: 1px solid var(--border);
            color: var(--muted);
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .nav-link:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        .nav-link.active {
            background: rgba(245, 197, 24, 0.12);
            color: var(--accent);
            border-color: var(--accent);
        }

        @media (max-width: 600px) {
            .nav-toggle { display: block; }
            .nav-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: calc(100% + 6px);
                right: 0;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 0.4rem;
                gap: 0.3rem;
                min-width: 140px;
                z-index: 100;
                box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            }
            .nav.open .nav-menu { display: flex; }
            .nav-link { padding: 6px 14px; font-size: 0.82rem; }
        }

        .error-banner {
            background: rgba(224, 76, 76, 0.12);
            border: 1px solid var(--error);
            border-radius: var(--radius);
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--error);
        }

        .error-banner strong {
            display: block;
            margin-bottom: 4px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 760px;
            margin: 0 auto 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1.2rem;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        input[type="text"],
        input[type="email"] {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.875rem;
            padding: 7px 10px;
            width: 100%;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .field-hint {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding-top: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 9px 24px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            transition: opacity 0.15s, background 0.15s, border-color 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a1a;
        }

        .btn-primary:hover {
            opacity: 0.88;
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--muted);
        }

        .btn-secondary:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        footer {
            max-width: 760px;
            margin: 0 auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.78rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.75rem; }
            h1 { font-size: 1.3rem; }
            .form-actions { flex-direction: column; }
            .form-actions .btn { justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-icon">✉️</div>
    <h1>Mailcow
        <span>Mailbox Alias Manager</span>
    </h1>
    <nav class="nav">
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">&#9776;</button>
        <div class="nav-menu" id="nav-menu">
            <a class="nav-link" href="{{.IngressPath}}/">Aliases</a>
            <a class="nav-link" href="{{.IngressPath}}/settings">Settings</a>
        </div>
    </nav>
</header>

{{if .Error}}
<div class="error-banner" style="max-width:760px;margin:0 auto 1.5rem;">
    <strong>Alias not created</strong>
    {{.Error}}
</div>
{{end}}

<form method="POST" action="{{.IngressPath}}/create">
<div class="stack">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Create alias</span>
        </div>
        <div class="card-body">
            <div class="field">
                <label for="address">Alias address</label>
                <input type="email" id="address" name="address"
                       value="{{.Address}}"
                       placeholder="alias@example.com" required>
                <span class="field-hint">The email address that will forward incoming mail.</span>
            </div>
            <div class="field">
                <label for="goto">Goto addresses</label>
                <input type="text" id="goto" name="goto"
                       value="{{.Goto}}"
                       placeholder="user@example.com, other@example.com" required>
                <span class="field-hint">One or more destination addresses, separated by commas.</span>
            </div>
        </div>
    </div>

    <div class="form-actions">
        <a class="btn btn-secondary" href="{{.IngressPath}}/">Cancel</a>
        <button type="submit" class="btn btn-primary">Create alias</button>
    </div>
</div>
</form>

<footer>
    <span>Mailcow v{{.Version}} &mdash; Create Alias</span>
</footer>

<script>
    (function () {
        var nav    = document.querySelector('.nav');
        var toggle = document.querySelector('.nav-toggle');
        if (!nav || !toggle) return;

        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = nav.classList.toggle('open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        document.addEventListener('click', function (e) {
            if (!nav.contains(e.target)) {
                nav.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    }());
</script>
</body>
</html>
